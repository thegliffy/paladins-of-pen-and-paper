name: Export map

on:
  push:
  pull_request:

jobs:
  pck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb unzip
          curl -fsSL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -o /tmp/godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version
      - name: Export pack and assert the map
        run: bash tools/check_export.sh
